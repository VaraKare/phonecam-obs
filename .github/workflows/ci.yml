name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: python3 -m unittest discover -s tools/tests -v
      - name: Native wire parser with sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined native/protocol_test.cpp -o /tmp/phonecam-protocol-test
          /tmp/phonecam-protocol-test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'  # the default also asks for 'tools', which Google removed
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phonecam-probe-research-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  windows-plugin:
    # Test build only: nothing here proves a real Windows PC, phone and OBS (docs/WINDOWS.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            native/build/*.zip
            native/build/*.tar.gz
          key: windows-downloads-obs-33.0.1-v1
      - run: python tools/build_windows.py
